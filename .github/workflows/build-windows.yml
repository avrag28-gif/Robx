name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "automation.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and packager
        run: python -m pip install --upgrade -r requirements.txt pyinstaller
      - name: Build desktop executable
        run: pyinstaller --noconfirm --clean --windowed --collect-all playwright --hidden-import automation --name ShopeeFlashSale app.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeFlashSale-Windows
          path: dist/ShopeeFlashSale.exe
          if-no-files-found: error
